stages:
  data_cleaning:
    cmd: python data_cleaning.py
    deps:
     - data/data/Music Info.py
     - data_cleaning.py
    outs:
     - data/data/cleaned_data.csv

  transform_data:
    cmd: python content_based_filtering.py
    deps:
     - data/data/cleaned_data.csv
     - content_based_filtering.py
     - data_cleaning.py
    outs:
     - data/data/transformed_data.npz
     - transformer.joblib